# Keep debug symbols in the archive, and match the application's static CRT.
# Scalar lib_cflags replace the upstream /Zi /MT defaults rather than appending
# conflicting flags. Other architecture-specific settings remain inherited.
my %targets = (
    "SoftEther-VC-WIN32" => {
        inherit_from => [ "VC-WIN32" ],
        lib_cflags => picker(debug => "/MTd /Z7 /Zl", release => "/MT /Z7 /Zl"),
    },
    "SoftEther-VC-WIN64A" => {
        inherit_from => [ "VC-WIN64A" ],
        lib_cflags => picker(debug => "/MTd /Z7 /Zl", release => "/MT /Z7 /Zl"),
    },
    "SoftEther-VC-WIN64-ARM" => {
        inherit_from => [ "VC-WIN64-ARM" ],
        lib_cflags => picker(debug => "/MTd /Z7 /Zl", release => "/MT /Z7 /Zl"),
    },
);
